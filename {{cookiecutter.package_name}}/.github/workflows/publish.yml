name: Continuous Deployment

# This workflow requires https://docs.pypi.org/trusted-publishers/ to be enabled for the repository.
# Follow instructions from this link to enable it.
# Use this workflow (`publish.yml`) in the configuration.
# Please note this process has to be repeated for Test PyPI and PyPI separately.

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  {% raw %}
  publish-pypi:
    permissions:
      id-token: write  # allows publishing to PyPI
      contents: write  # allows uploading a GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 1
          ref: ${{ github.ref }}

      - uses: ./.github/actions/setup-uv-nox

      - name: Build
        run: uv build

      - name: Create GitHub release
        id: create-release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda  # v3.0.0
        with:
          name: ${{ github.ref_name }}
          body: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: >-
            dist/*.tar.gz
            dist/*.whl

      - name: Detect release type
        id: release-type
        run: |
          if [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(a|b|rc)[0-9]+$ ]]; then
            echo "type=pre-release" >> $GITHUB_OUTPUT
          elif [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "type=stable" >> $GITHUB_OUTPUT
          else
            echo "Invalid tag format"
            exit 1
          fi

      - name: Publish distribution 📦 to TestPyPI
        if: steps.release-type.outputs.type == 'pre-release'
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # v1.14.0
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: Publish distribution 📦 to PyPI
        if: steps.release-type.outputs.type == 'stable'
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # v1.14.0
  {% endraw %}

  {% if cookiecutter.build_docker_image %}
  {% raw %}
  publish-docker:
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      packages: write  # allows publishing to GitHub Container Registry
      contents: read   # required for the Docker build context
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Compute Docker image tags
        id: docker-tags
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          TAGS="ghcr.io/${{ github.repository }}:$VERSION"

          HIGHEST=$(git tag --sort=-v:refname | head -n1)
          if [[ "${GITHUB_REF_NAME}" == "$HIGHEST" ]]; then
            TAGS="$TAGS,ghcr.io/${{ github.repository }}:latest"
          fi

          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4.0.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v7.1.0
        env:
          IMAGE_NAME: ${{ github.repository }}
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker-tags.outputs.tags }}
  {% endraw %}
  {% endif %}
