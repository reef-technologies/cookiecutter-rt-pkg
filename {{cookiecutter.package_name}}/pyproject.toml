[project]
name = "{{cookiecutter.package_name.replace('_', '-')}}"
requires-python = ">={{ cookiecutter.python_versions.split(',') | map('trim') | sort_versions | first }}"
keywords = []
license = {text = "MIT"}
readme = "README.md"
authors = [
    {name = "Reef Technologies", email = "opensource@reef.pl"},
]
classifiers = [
    {% if cookiecutter.django_versions %}
    "Framework :: Django",
    {% for version in cookiecutter.django_versions.split(',') | map('trim') %}
    "Framework :: Django :: {{ version }}",
    {% endfor %}
    {% endif %}
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    {% for version in cookiecutter.python_versions.split(',') | map('trim') %}
    "Programming Language :: Python :: {{ version }}",
    {% endfor %}
]
dynamic = [
    "version",
]
dependencies = [
]

[project.urls]
"Source" = "{{cookiecutter.repository_github_url}}"
"Issue Tracker" = "{{cookiecutter.repository_github_url}}/issues"
"Changelog" = "{{cookiecutter.repository_github_url}}/blob/master/CHANGELOG.md"

[build-system]
requires = ["hatchling==1.29.0", "hatch-vcs==0.5.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.build.hooks.vcs]
version-file = "src/{{cookiecutter.package_name}}/_version.py"

[dependency-groups]
test = [
    "freezegun==1.5.5",
    "pytest==9.0.2",
    "pytest-apiver==0.1.0",
    "pytest-asyncio==1.3.0",
    {% if cookiecutter.django_versions %}
    "pytest-django==4.12.0",
    {% endif %}
    "pytest-xdist==3.8.0",
]
lint = [
    "codespell[toml]==2.4.2",
    {% if cookiecutter.django_versions %}
    "django-stubs==5.2.9",
    {% endif %}
    "mypy==1.20.0",
    "ruff==0.15.8",
    "types-freezegun==1.1.10",
    "types-python-dateutil==2.9.0.20260323",
    "types-requests==2.33.0.20260327",
]

[tool.commitizen]
version_provider = "scm"
annotated_tag = true
tag_format = "v$version"
changelog_file = "CHANGELOG.md"
update_changelog_on_bump = true

[tool.pytest.ini_options]
pythonpath = ["."]  # allow for `import tests` in test files
target_package_name = "{{cookiecutter.package_name}}"  # required by pytest-apiver

{% if cookiecutter.django_versions %}
DJANGO_SETTINGS_MODULE="tests.settings"
{% endif %}

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "D",
    "E", "F", "I", "UP",
    "TC005",
]
ignore = [
    "D100", "D105", "D107", "D200", "D202", "D203", "D205", "D212", "D400", "D401", "D415",
    "D101", "D102", "D103", "D104", # TODO remove once we have docstring for all public methods
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"test/**" = ["D", "F403", "F405"]

[tool.codespell]
skip = "*.min.js,uv.lock"
ignore-words-list = "datas"

[tool.mypy]

[[tool.mypy.overrides]]
module = [
    "nox",
    "pytest",
    "tests.*",
]
ignore_missing_imports = true

[tool.uv]
exclude-newer = "14 days"
